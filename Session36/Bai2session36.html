<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        .main{
            width: 100vw;
            display: flex;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            margin-top: 50px;
        }
        img{
            width: 200px;
            height: 150px;
            border-radius: 7px;
        }
        .foodList{
            box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            gap: 30px;
        }
        .info{
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            width: 170px;
        }
        .quantityLike {
            font-size: 17px;
            color: rgb(108, 108, 108);
        }
        .btnLike {
            background-color: rgb(13, 200, 10);
            border: none;
            color: white;
            border-radius: 5px;
            width: 100px;
            height: 30px;
            cursor: pointer;
        }
        .btnLike:hover{
            background-color: rgb(4, 179, 1);
        }
    </style>
</head>

    <div class="main">
    </div>
