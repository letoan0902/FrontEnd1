<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #body{
            width: 100vw;
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(230, 250, 255);
        }
        #header{
            font-size: 50px;
            color: rgb(85, 85, 250);
            text-align: center;
        }
        #search{
            width: 600px;
            height: 40px;
            border-radius: 7px;
            border: 1px solid rgb(193, 193, 193);
            background-color: rgb(222, 222, 255);
        }
        input{
            background-color: rgb(222, 222, 255);
            width: 83%;
            margin: 2px;
            height: 80%;
            padding-left: 10px;
            padding-top: 4px;
            border: none;
            outline: none;
        }
        #button{
            position: relative;
            left: 4px;
            bottom: 2px;
            width: 13%;
            height: 100%;
            border-radius: 7px;
            border: none;
            background-color: rgb(82, 82, 254);
            color: white;
            border-top-left-radius: 0px;
            border-bottom-left-radius: 0px;
            cursor: pointer;
        }
        #button:hover{
            background-color: rgb(51, 51, 254);
        }
        #result{
            box-shadow: rgba(50, 50, 93, 0.25) 0px 2px 5px -1px, rgba(0, 0, 0, 0.3) 0px 1px 3px -1px;
            border-radius: 10px;
            background-color: white;
            margin-top: 20px;
            padding: 20px;
        }
        #icon{
            font-size: 100px;
        }
        #temperature{
            font-size: 55px;
        }
        #info{
            padding-left: 20px;
            font-size: 20px;
        }
        P{
            margin-top: 10px;
            margin-bottom: 10px;
        }
        #textBody{
            margin: 0px;
        }
    </style>
</head>
<body id="body">
    <div id="main">
        <h1 id="header">Ứng dụng Thời tiết</h1>
        <div id="search">
            <input type="text" id="input" placeholder="Nhập thành phố">
            <button id="button">Tìm kiếm</button>
        </div>
        <div id="result">
        </div>
    </div>
    <script src="./Bai6session33.js"></script>
</body>
</html>
