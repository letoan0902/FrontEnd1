<!DOCTYPE html>
<html lang="en">
  <head>
    <title>session33</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        border: none;
        border-radius: 5px;
      }
      button:hover {
        cursor: pointer;
      }
      li {
        list-style: none;
      }
      img {
        width: 200px;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <h1
      style="
        text-align: center;
        width: 60%;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 20px;
      "
    >
      Cửa hàng Đơn giản
    </h1>
    <div
      style="
        display: flex;
        gap: 10px;
        width: 75vw;
        margin-left: auto;
        margin-right: auto;
      "
    >
      <div style="flex: 2">
        <h2 style="text-align: center; margin-bottom: 20px">Sản phẩm</h2>
        <div
          id="product-list"
          style="display: flex; gap: 10px; flex-wrap: wrap"
        ></div>
      </div>
      <div
        style="
          flex: 1;
          height: max-content;
          box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        "
      >
        <h2 style="text-align: center">Giỏ hàng</h2>
        <div id="cart-list"></div>
        <div style="text-align: right">
          <span>Tổng: </span><span id="total-cart" style="margin: 10px"></span>
        </div>
        <button
          onclick="pay()"
          style="
            text-align: center;
            color: white;
            background-color: blue;
            margin: 10px;
            width: calc(100% - 20px);
            height: 30px;
            font-size: 20px;
          "
        >
          Thanh toán
        </button>
      </div>
    </div>
    <script src="./javascript.js"></script>
  </body>
</html>
