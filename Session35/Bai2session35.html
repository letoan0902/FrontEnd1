<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        #body{
            background-color: rgb(167, 117, 213);
        }
        h1{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 500px;
            height: 100px;
            margin: 30px auto;
            text-align: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.6);
            font-weight: 450;
            cursor: pointer;
        }
        h1:hover{
            opacity: 0.8;
        }
        #main{
            padding: 30px;
            padding-left: 10%;
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }
        #add{
            width: 50%;
            position: fixed;
            top: 30%;
            left: 25%;
            display: none;
        }
        #headerAdd{
            padding: 0px 15px;
            height: 50px;
            background-color: rgb(160, 70, 160);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #headAdd{
            font-size: 19px;
        }
        #closeAdd{
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        #closeAdd:hover{
            background-color: rgb(255, 125, 125);
        }
        #bodyAdd{
            background-color: white;
            color: rgb(138, 63, 138);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .input{
            margin-bottom: 15px;
            border: 2px solid rgb(207, 104, 207);
            border-radius: 5px;
            height: 25px;
            outline: none;
            padding-left: 5px;
        }
        #button{
            width: 80px;
            height: 25px;
            color: white;
            background-color: rgb(154, 65, 154);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #button:hover{
            opacity: 0.8;
        }
        .block{
            display: flex;
            justify-content: center;
            align-items: center;
            width: 45%;
            height: 100px;
            border-radius: 7px;
            text-align: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.6);
            font-weight: 450;
            display: flex;
            flex-direction: column;
        }
        .closeBlock{
            width: 30px;
            height: 30px;
            font-size: 20px;
            position: relative;
            left: 45%;
            cursor: pointer;
            padding-right: 20px;
        }
        .closeBlock:hover{
            color: rgb(86, 86, 86);
        }
        .block{
            cursor: pointer;
        }
        .block:hover{
            opacity: 0.8;
        }
    </style>
</head>
<body id="body">
    <div>
        <h1 id="h1">ADD BOOKMARK</h1>
        <div id="main">
            <div class="block">
                <p class="closeBlock">✖︎</p>
                <h3 class="contentBlock">GOOGLE - SEARCH ENGINE</h3>
            </div>
            <div class="block">
                <p class="closeBlock">✖︎</p>
                <h3 class="contentBlock">GOOGLE - SEARCH ENGINE</h3>
            </div>
            <div class="block">
                <p class="closeBlock">✖︎</p>
                <h3 class="contentBlock">GOOGLE - SEARCH ENGINE</h3>
            </div>
        </div>
    </div>
    <div id="add">
        <div id="headerAdd">
            <span id="headAdd">Add Bookmark</span>
            <span id="closeAdd">✖︎</span>
        </div>
        <div id="bodyAdd">
            <p class="lable">Website Name</p>
            <input type="text" id="name" class="input">
            <p class="lable">Website URL</p>
            <input type="text" class="input" id="url">
            <button id="button">Save</button>
        </div>
    </div>
    <script src="./Bai2session35.js"></script>
</body>
</html>
