<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            width: 100%;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0.1;
        }
        button{
            border: none;
            border-radius: 5px;
            background-color: rgb(149, 149, 245);
            color: white;
            width: 150px;
            height: 35px;
            cursor: pointer;
        }
        #increase{
            margin-right: 10px;
        }
        #divButton{
            margin-top: 20px;
        }
        .div{
            width: 500px;
            height: 30px;
            background-color: rgb(248, 234, 234);
            border-radius: 5px;
        }
        #divAfter{
            border-top-right-radius: 0px;
            border-bottom-right-radius: 0px;
            width: 0%;
            background-color: rgb(158, 252, 158);
        }
        button:hover{
            background-color: rgb(119, 119, 240);
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>Progress Bar with Background Effect</h1>
        <div class="div">
            <div class="div" id="divAfter"></div>
        </div>
        <div id="divButton">
            <button id="increase">Tăng tiến trình</button>
            <button id="decrease" >Giảm tiến trình</button>
        </div>
    </div>
    <script src="./Bai9session32.js"></script>
</body>
</html>
