<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        #header{
            margin: 30px;
        }
        #infoInput{
            margin-bottom: 30px;
        }
        td,th{
            text-align: center;
        }
        .btn-info{
            border: none;
            background-color: rgb(119, 119, 255);
            border-radius: 5px;
            width: 30px;
            height: 30px;
            color: white;
            font-size: 13px;
        }
        .btn-info:hover{
            background-color: rgb(77, 77, 255);
        }
        #editForm{
            position: fixed;
            border-radius: 10px;
            height: 80px;
            padding:20px;
            top: 30%;
            background-color: rgb(91, 255, 255);
            display: none;
        }
    </style>
</head>
<body>
    <h2 style="text-align: center;" id="header">Task Management</h2>
    <div class="container-fluid mt-5" id="infoInput">
        <form>
            <div class="row">
                <div class="col">
                    <input type="text" class="form-control" id="content" placeholder="Content">
                </div>
                <div class="col">
                    <input type="date" class="form-control" id="date">
                </div>
                <div class="col">
                    <select class="form-select" id="status">
                        <option selected>Choose status</option>
                        <option value="Pending">Pending</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="col">
                    <input type="text" class="form-control" id="username" placeholder="Username">
                </div>
                <div class="col-auto align-self-end">
                    <button type="button" class="btn btn-primary" id="button">Submit</button>
                </div>
            </div>
        </form>
    </div>


    <table class="table">
        <thead class="table-light">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Content</th>
            <th scope="col">Due date</th>
            <th scope="col">Status</th>
            <th scope="col">Assigned to</th>
            <th scope="col" colspan="2">Action</th>
          </tr>
        </thead>
        <tbody class="table-group-divider" id="tbody">
          
        </tbody>
        
        <div class="container-fluid mt-5" id="editForm">
            <form>
                <div class="row">
                    <div class="col">
                        <input type="text" class="form-control" id="contentEdit" placeholder="Content">
                    </div>
                    <div class="col">
                        <input type="date" class="form-control" id="dateEdit">
                    </div>
                    <div class="col">
                        <select class="form-select" id="statusEdit">
                            <option selected>Choose status</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                    <div class="col">
                        <input type="text" class="form-control" id="usernameEdit" placeholder="Username">
                    </div>
                    <div class="col-auto align-self-end">
                        <button type="button" class="btn btn-primary" id="buttonEdit">Submit</button>
                    </div>
                </div>
            </form>
        </div>




      </table>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>  
    <script src="./Bai2session34.js"></script>
</body>
</html>
