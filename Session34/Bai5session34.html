<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            text-align: center;
        }
        .add {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        input {
            margin-right: 10px;
            padding: 5px;
        }
        #button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        #button:hover {
            background-color: #307e34;
        }
        table {
            width: 60%;
            margin:auto;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #dfdfdf;
        }
    </style>
</head>
<body>
    <h1>Danh sách nhân viên Rikkei</h1>
    <div class="add">
        <input type="text" id="name" placeholder="Tên nhân viên">
        <input type="text" id="position" placeholder="Chức vụ">
        <button id="button">Thêm nhân viên</button>
    </div>
    <table id="table">
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên</th>
                <th>Chức vụ</th>
            </tr>
        </thead>
        <tbody id="tbody">

        </tbody>
    </table>

    <script src="./Bai5session34.js"></script>
</body>
</html>
